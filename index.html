<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Rosco del Huerto</title>
<meta name="description" content="Juego de rosco sobre agricultura sostenible para 4.º de Primaria (Comunitat Valenciana).">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="images/logo.svg" width="52" height="52" alt="" aria-hidden="true">
    <div>
      <h1>El Rosco del Huerto</h1>
      <p>Agricultura sostenible · 4.º de Primaria · Comunitat Valenciana</p>
    </div>
  </header>

  <main class="game">
    <div class="rosco" id="rosco">
      <ol class="nodes" id="nodes" aria-label="Rosco de letras"></ol>
      <div class="hub" id="hub">
        <span class="lab" id="hubLab">Tiempo</span>
        <span class="time" id="hubTime">8:00</span>
        <div class="tally">
          <span><i class="d-ok"></i><b id="tOk">0</b> bien</span>
          <span><i class="d-bad"></i><b id="tBad">0</b> <em class="lb" id="lblBad">mal</em></span>
          <span><i class="d-left"></i><b id="tLeft">22</b> faltan</span>
        </div>
      </div>
    </div>
    <section class="panel" id="panel" aria-live="polite" aria-label="Zona de juego"></section>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
